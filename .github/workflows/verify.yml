name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-01234567890123456789012345
      SCHEDULER_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ml-service/requirements.lock.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r ml-service/requirements.lock.txt
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:python
      - run: npm run test:ml
      - name: Execute notebook
        run: |
          if [ -d ml-service/data/ddxplus ] && compgen -G "ml-service/data/ddxplus/release_train_patients*" > /dev/null; then
            python ml-service/execute_notebook.py
          else
            echo "SKIP: DDXPlus patient data is local-only (gitignored); notebook execution is verified on a machine with the dataset."
          fi
      - run: npm run build
      - run: npm run test:integration
